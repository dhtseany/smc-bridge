[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-bridge"
version = "1.1.3"
description = "A bridge app, written in Python, that works between an M-Vave SMC-Mixer and jack_mixer using mac2CC (MIDI Absolute Control to CC)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sean Snell" }]
dependencies = [
    "PySide6>=6.6,<7",
]

[project.urls]
Homepage = "https://github.com/dhtseany/smc-bridge"

[project.scripts]
smc-bridge = "smc_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["smc_bridge*"]
